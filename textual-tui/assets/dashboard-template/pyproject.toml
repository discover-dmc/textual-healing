[project]
name = "dashboard"
version = "0.1.0"
description = "Textual dashboard starter: keyed DataTable, Sparkline, RichLog, modal help, command palette, custom theme"
requires-python = ">=3.11"
dependencies = ["textual>=8.2"]

[project.scripts]
dashboard = "dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dashboard"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-textual-snapshot>=1.0", "textual-dev>=1.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# If you also use pytest-socket, allow the asyncio self-pipe:
# addopts = "--disable-socket --allow-unix-socket"
